<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Color the Car — Drawing App Milestone 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #2b2a4a;
      --ink-soft: #5a587a;
      --paper: #fffdf8;
      --bg1: #fff4dc;
      --bg2: #cce9ff;
      --card: #ffffff;
      --accent: #ff7ab6;
      --shadow: 0 16px 40px rgba(62, 48, 110, 0.14);
      --swatch-size: 56px;
      --ui-radius: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      background:
        radial-gradient(1200px 700px at 15% -10%, #ffe7a8 0%, transparent 55%),
        radial-gradient(1000px 600px at 110% 10%, #d4f0ff 0%, transparent 50%),
        linear-gradient(180deg, var(--bg1) 0%, #f7fbff 42%, var(--bg2) 100%);
      color: var(--ink);
      font-family: "Fredoka", "Trebuchet MS", "Avenir Next", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      min-height: 100dvh;
      padding: max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    }

    .app {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      min-height: 0;
      min-width: 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
      min-width: 0;
    }

    .title-block { min-width: 0; flex: 1; }

    .title-block h1 {
      font-size: clamp(1.2rem, 4.4vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .title-block p {
      color: var(--ink-soft);
      font-size: 0.88rem;
      font-weight: 500;
      margin-top: 2px;
      line-height: 1.25;
    }

    .pills {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      background: rgba(255, 255, 255, 0.82);
      border: 2px solid rgba(43, 42, 74, 0.08);
      box-shadow: 0 4px 12px rgba(43, 42, 74, 0.06);
      transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
      user-select: none;
      white-space: nowrap;
    }

    .pill .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #c5c3d6;
      flex-shrink: 0;
    }

    .pill.is-inside {
      background: #e8fff4;
      border-color: #6fe3ad;
      color: #0d7a4d;
    }

    .pill.is-inside .dot {
      background: #19c37d;
      animation: pulseDot 1.1s ease-out infinite;
    }

    .pill.is-outside {
      background: #fff6f2;
      border-color: #ffd0c2;
      color: #a14a32;
    }

    .pill.is-outside .dot { background: #ff8a6b; }

    @keyframes pulseDot {
      0% { box-shadow: 0 0 0 0 rgba(25, 195, 125, 0.55); }
      70% { box-shadow: 0 0 0 8px rgba(25, 195, 125, 0); }
      100% { box-shadow: 0 0 0 0 rgba(25, 195, 125, 0); }
    }

    .coverage {
      min-width: 128px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .coverage-bar {
      flex: 1;
      height: 8px;
      min-width: 56px;
      border-radius: 999px;
      background: rgba(43, 42, 74, 0.1);
      overflow: hidden;
    }

    .coverage-bar > span {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffc43d, #ff7ab6);
      transition: width 200ms ease;
    }

    .coverage.is-complete {
      background: #fff3c4;
      border-color: #ffd56a;
      color: #8a5a00;
    }

    .stage-shell {
      flex: 1;
      min-height: 0;
      min-width: 0;
      background: var(--card);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: min(100%, calc(100dvh - 270px), 640px);
      aspect-ratio: 1 / 1;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    .stage canvas,
    .stage svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    .stage svg { overflow: visible; }

    .stage.is-inside-hover .outline-active {
      filter: drop-shadow(0 0 10px rgba(61, 169, 252, 0.4));
    }

    .yay {
      position: absolute;
      left: 50%;
      top: 10%;
      transform: translateX(-50%) scale(0.6);
      opacity: 0;
      pointer-events: none;
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      font-weight: 700;
      color: #ff7ab6;
      text-shadow: 0 6px 0 rgba(255, 196, 61, 0.45);
      z-index: 8;
    }

    .yay.show { animation: yayPop 1100ms ease-out forwards; }

    @keyframes yayPop {
      0% { opacity: 0; transform: translate(-50%, 18px) scale(0.5) rotate(-8deg); }
      25% { opacity: 1; transform: translate(-50%, 0) scale(1.18) rotate(4deg); }
      70% { opacity: 1; transform: translate(-50%, -8px) scale(1) rotate(0deg); }
      100% { opacity: 0; transform: translate(-50%, -36px) scale(0.9) rotate(0deg); }
    }

    .sparkle-layer, .confetti-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
      z-index: 7;
    }

    .spark {
      position: absolute;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      pointer-events: none;
      border-radius: 1px;
      background: #ffe07a;
      box-shadow: 0 0 8px rgba(255, 224, 122, 0.9);
      animation: sparkFly 0.7s ease-out forwards;
    }

    @keyframes sparkFly {
      0% { opacity: 1; transform: translate(0, 0) scale(0.4) rotate(0deg); }
      70% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(120deg); }
    }

    .confetti-piece {
      position: absolute;
      left: 50%;
      top: 42%;
      width: 10px;
      height: 14px;
      margin: -5px 0 0 -5px;
      border-radius: 2px;
      pointer-events: none;
      opacity: 0;
    }

    .badge-node.pop { animation: badgePop 0.5s cubic-bezier(0.22, 1.4, 0.36, 1); transform-box: fill-box; transform-origin: center; }

    @keyframes badgePop {
      0% { transform: scale(1); }
      45% { transform: scale(1.28); }
      100% { transform: scale(1); }
    }

    .toolbar {
      flex-shrink: 0;
      background: var(--card);
      border-radius: 26px;
      box-shadow: var(--shadow);
      padding: 10px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      width: 100%;
    }

    .swatches {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
      padding: 6px 8px 4px;
    }

    .swatch {
      width: var(--swatch-size);
      height: var(--swatch-size);
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 0 rgba(43, 42, 74, 0.12), inset 0 -4px 0 rgba(0, 0, 0, 0.08);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 120ms ease;
      position: relative;
      flex: 0 0 var(--swatch-size);
    }

    .swatch:active { transform: scale(0.92); }

    .swatch[aria-pressed="true"] {
      transform: translateY(-2px) scale(1.08);
      box-shadow:
        0 0 0 4px #fff,
        0 0 0 7px var(--ink),
        0 6px 0 rgba(43, 42, 74, 0.12);
    }

    .swatch:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    .swatch-num {
      position: absolute;
      right: -4px;
      bottom: -4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      color: var(--ink);
      font-size: 0.7rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 0 rgba(43, 42, 74, 0.18);
      border: 2px solid var(--ink);
      line-height: 1;
      pointer-events: none;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr auto auto;
      gap: 8px;
      min-width: 0;
    }

    .btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 16px;
      min-height: 52px;
      padding: 0 12px;
      color: var(--ink);
      background: #f3f0ff;
      box-shadow: 0 3px 0 rgba(43, 42, 74, 0.12);
      transition: transform 120ms ease, background 120ms ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      min-width: 0;
    }

    .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(43, 42, 74, 0.12); }
    .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

    .btn[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
    }

    .btn-wiggle { background: #ffe07a; }
    .btn-reset { background: #ffe4ea; }
    .mode-icon { font-size: 1.05rem; line-height: 1; }

    @media (max-width: 420px) {
      :root { --swatch-size: 46px; }
      .actions { grid-template-columns: 1fr 1fr; }
      .btn { min-height: 48px; font-size: 0.92rem; }
      body { padding-left: 8px; padding-right: 8px; }
      .swatch-num { width: 18px; height: 18px; font-size: 0.65rem; }
      .title-block p { font-size: 0.8rem; }
    }

    @media (max-height: 760px) {
      .app { gap: 8px; }
      .stage-shell { padding: 8px; border-radius: 22px; }
      .toolbar { padding: 8px 10px 10px; gap: 8px; border-radius: 22px; }
      .btn { min-height: 46px; }
      .stage { width: min(100%, calc(100dvh - 250px), 640px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .pill .dot, .yay.show, .spark, .badge-node.pop { animation: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-block">
        <h1>Color the Car!</h1>
        <p>Color each numbered part, then give it a wiggle.</p>

            <g class="badge-node" data-region="2" transform="translate(400 430)">

        <div class="yay" id="yay" aria-hidden="true">Yay!</div>

    </div>

    <div class="toolbar">
      <div class="swatches" id="swatches" role="listbox" aria-label="Colors"></div>
      <div class="actions">
        <button class="btn" id="brushBtn" type="button" aria-pressed="false">
          <span class="mode-icon" aria-hidden="true">🖌️</span> Brush
        </button>
        <button class="btn" id="bucketBtn" type="button" aria-pressed="true">
          <span class="mode-icon" aria-hidden="true">🪣</span> Fill
        </button>

      </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>

        var tapRegion = downRegion || regionNow;
        if (mode === "bucket") {
          animateFill(tapRegion, p.x, p.y, false);
        } else {
          playWiggle(false);
        }
      } else if (didDraw) {
        if (lockedRegion.hardenRaf) {
          cancelAnimationFrame(lockedRegion.hardenRaf);
          lockedRegion.hardenRaf = 0;
        }
        hardenClip(lockedRegion);
        updateRegionCoverage(lockedRegion, true);
        updateProgress();
      }

      drawing = false;
      strokeLive = false;
      pointerId = null;
      lockedRegion = null;
      var keepHover = e && e.type !== "pointerleave" && e.type !== "pointercancel";
      setStatus(regionNow, keepHover);
    }

    function onPointerUp(e) { endPointer(e); }

    function onPointerLeave(e) {
      if (pointerId === null) setStatus(null, false);
    }

    function countPaintedExclusive(id) {
      var r = byId(id);
      if (!r) return 0;
      var size = COVERAGE_SIZE;
      var sample = document.createElement("canvas");
      sample.width = size;
      sample.height = size;
      var sctx = sample.getContext("2d", { willReadFrequently: true });
      sctx.drawImage(r.canvas, 0, 0, size, size);
      var data = sctx.getImageData(0, 0, size, size).data;
      var painted = 0;
      for (var i = 0; i < data.length; i += 4) {
        if (r.maskData[i + 3] > 128 && data[i + 3] > 32) painted++;
      }
      return painted;
    }

    function countPaintedOnCanvas(id) {
      var r = byId(id);
      if (!r) return 0;
      var size = COVERAGE_SIZE;
      var sample = document.createElement("canvas");
      sample.width = size;
      sample.height = size;
      var sctx = sample.getContext("2d", { willReadFrequently: true });
      sctx.drawImage(r.canvas, 0, 0, size, size);
      var data = sctx.getImageData(0, 0, size, size).data;
      var painted = 0;
      for (var i = 3; i < data.length; i += 4) {
        if (data[i] > 32) painted++;
      }
      return painted;
    }

    function countPaintedOutsideAll() {
      var size = COVERAGE_SIZE;
      var sample = document.createElement("canvas");
      sample.width = size;
      sample.height = size;
      var sctx = sample.getContext("2d", { willReadFrequently: true });
      var backToFront = regions.slice().sort(function (a, b) { return a.z - b.z; });
      backToFront.forEach(function (r) { sctx.drawImage(r.canvas, 0, 0, size, size); });
      var union = document.createElement("canvas");
      union.width = size;
      union.height = size;
      var uctx = union.getContext("2d");
      uctx.setTransform(size / VIEW, 0, 0, size / VIEW, 0, 0);
      uctx.fillStyle = "#fff";
      regions.forEach(function (r) { uctx.fill(r.path); });
      // Dilate the union mask 1px so downsample antialiasing at outlines is not counted as spill.
      uctx.setTransform(1, 0, 0, 1, 0, 0);
      uctx.globalCompositeOperation = "source-over";
      var raw = document.createElement("canvas");
      raw.width = size; raw.height = size;
      raw.getContext("2d").drawImage(union, 0, 0);
      uctx.clearRect(0, 0, size, size);
      for (var ox = -1; ox <= 1; ox++) {
        for (var oy = -1; oy <= 1; oy++) {
          uctx.drawImage(raw, ox, oy);
        }
      }
      var paint = sctx.getImageData(0, 0, size, size).data;
      var mask = uctx.getImageData(0, 0, size, size).data;
      var outside = 0;
      for (var i = 0; i < paint.length; i += 4) {
        if (paint[i + 3] > 32 && mask[i + 3] <= 128) outside++;
      }
      return outside;
    }

    function drawTestStroke(id, points, hex) {
      var r = byId(id);
      if (!r || !points || points.length < 1) return;
      var prev = color;
      if (hex) color = hex;
      beginStroke(r, points[0][0], points[0][1]);
      for (var i = 1; i < points.length; i++) {
        extendStroke(r, points[i - 1][0], points[i - 1][1], points[i][0], points[i][1]);
      }
      if (r.hardenRaf) { cancelAnimationFrame(r.hardenRaf); r.hardenRaf = 0; }
      hardenClip(r);
      updateRegionCoverage(r, false);
      updateProgress();
      color = prev;
    }

    stage.addEventListener("pointerdown", onPointerDown);
    stage.addEventListener("pointermove", onPointerMove);
    stage.addEventListener("pointerup", onPointerUp);
    stage.addEventListener("pointercancel", onPointerUp);
    stage.addEventListener("pointerleave", onPointerLeave);
    stage.addEventListener("lostpointercapture", function (e) {
      if (e.pointerId === pointerId) endPointer(e);
    });
    window.addEventListener("pointerup", onPointerUp);
    window.addEventListener("pointercancel", onPointerUp);
    window.addEventListener("pointermove", function (e) {
      if (pointerId !== null && e.pointerId === pointerId) onPointerMove(e);
    });
    stage.addEventListener("contextmenu", function (e) { e.preventDefault(); });

    brushBtn.addEventListener("click", function () { setMode("brush"); });
    bucketBtn.addEventListener("click", function () { setMode("bucket"); });
    wiggleBtn.addEventListener("click", function () { playWiggle(false); });
    resetBtn.addEventListener("click", resetAll);

    window.addEventListener("resize", function () {
      resizeCanvases();
    });

    buildSwatches();
    setupMasks();
    resizeCanvases();
    updateProgress();

    window.__twinkle = {
      VIEW: VIEW,
      regions: regions.map(function (r) {
        return { id: r.id, key: r.key, name: r.name, short: r.short, badge: r.badge, origin: r.origin, d: r.d };
      }),
      hitRegion: function (x, y) {
        var r = hitRegion(x, y);
        return r ? r.id : 0;
      },
      isInsideRegion: function (id, x, y) {
        var r = hitRegion(x, y);
        return !!(r && r.id === id);
      },
      setMode: setMode,
      getMode: function () { return mode; },
      setColor: setColor,
      getColor: function () { return color; },
      fillRegion: fillRegion,
      getRegionFilled: function (id) { var r = byId(id); return !!(r && r.filled); },
      getRegionCoverage: function (id) { var r = byId(id); return r ? r.coverage : 0; },
      getRegionFillColor: function (id) { var r = byId(id); return r ? r.fillColor : null; },
      getColoredCount: function () { return coloredCount; },
      didCelebrate: function () { return celebrated; },
      isCelebrating: function () { return celebrating; },
      playWiggle: playWiggle,
      resetAll: resetAll,
      countPaintedExclusive: countPaintedExclusive,
      countPaintedOnCanvas: countPaintedOnCanvas,
      countPaintedOutsideAll: countPaintedOutsideAll,
      drawTestStroke: drawTestStroke,
      getStage: function () { return stage; },
      eventToLocal: eventToLocal
    };
  })();
  </script>
  <style>
    @keyframes cssWiggle {
      0% { transform: none; }
      20% { transform: rotate(-8deg) scale(1.1, 0.88) translateY(-8px); }
      40% { transform: rotate(8deg) scale(0.9, 1.1) translateY(-18px); }
      60% { transform: rotate(-5deg) scale(1.06, 0.94) translateY(-6px); }
      80% { transform: rotate(3deg) scale(0.98, 1.03) translateY(-2px); }
      100% { transform: none; }
    }
    .stage.css-wiggle { animation: cssWiggle 0.62s cubic-bezier(0.22, 1, 0.36, 1); }
  </style>
</body>
</html>
